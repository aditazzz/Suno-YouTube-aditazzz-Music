# One entry per YouTube video. Anything left out falls back to the song's song.yaml
# (thumb_lines, thumb_sub, thumb_hook_side, ctx_/thumb_ shift, scale, dark).
# lines: headline, last line is drawn in neon green (accent: red / amber / yellow / ice to suit the frame; no pink).  sub: the italic description.
# side: which side the headline sits on (the lockup is always top-left).
# `backticks` in lines/sub: commands and code, set in mono and kept in their own case.
# tag: small series/version label above the headline.  lift: brighten a very dark frame (1.3).
# shift / shift_y / scale / dark: framing of the video frame (same meaning as ctx_* in song.yaml).

ai-slop-city:
  accent: ice
  lines: ["YOU'RE", ABSOLUTELY, RIGHT]
  sub: "a song about AI slop, sung by the AI"
eleven-kept-going:
  accent: amber
  lines: [11 KEPT GOING, ONE CAME HOME]
  sub: "a song about the first Falcon 9 landing"
  scale: 1.32        # closer on the booster
  shift: 0.24
ted-talk-screenlife:
