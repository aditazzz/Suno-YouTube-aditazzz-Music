  dark: 0.82         # quiet the comment text behind the headline
mirror-vanity:
  tag: "Mirror, Mirror · v1 vanity"
  accent: red
  lines: [FUNNY HOW, IT LOOKS LIKE US]
  sub: "a pop song about the AI art debate"
omg-agents-swarm:
