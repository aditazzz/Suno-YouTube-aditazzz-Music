  lines: [I DEPLOYED, ON A FRIDAY]
  sub: "4:59 PM. Prod went down."
rate-limited:
  lines: [MY AI LEFT, ME ON READ]
  sub: "a love song about hitting the rate limit"
vacation-to-my-bed:
  accent: red
  lines: [ONE-WAY TICKET, TO MY BED]
  sub: "a burnout anthem for the chronically tired"
  side: left         # picture built in studio/brand.py: poster on the right, clean paper behind the text
ted-talk:
  accent: yellow
  lines: [STANDUP BECAME, A KEYNOTE]
  tag: "TED Talk · the original"
  sub: "a song about the coworker who never just answers"
  shift: 0.24        # Ted stands clear of the headline
