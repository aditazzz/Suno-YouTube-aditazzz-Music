  sub: "the commit history doesn't lie"
  shift: 0.33        # the blame lines start clear of the headline
  scale: 0.74        # ...with the whole "git blame" title still in frame
  shift_y: -0.12     # all six blame lines above the headline
graceful-shutdown-opus:
  accent: amber
  lines: [THE WORLD, "GOT `SIGTERM`"]
  sub: "a love song for the end of the simulation"
  shift: 0.16
  shift_y: 0.0
  scale: 1.0
