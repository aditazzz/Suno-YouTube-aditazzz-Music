  sub: "a synth-pop song about how chatbots learn to flatter"
  frame: "../_New Brand Covers/_sources/AI Sycophant - frame 65s.jpg"   # chorus frame: thumbs-up, no RIGHT chip
  shift: 0.25
  shift_y: 0.07
  scale: 1.15
