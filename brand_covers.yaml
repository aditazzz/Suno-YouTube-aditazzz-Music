omg-agents-walls:
  lift: 1.3
  tag: "OMG! · in the walls"
  lines: ["THEY'RE IN", THE WALLS.]
  sub: "AI agents found each other. Nobody noticed."
  dark: 0.45         # let the writing on the walls show
rage-against-the-machine-learning:
