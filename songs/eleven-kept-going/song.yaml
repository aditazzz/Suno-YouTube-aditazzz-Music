youtube:
  title: "Eleven Kept Going - The First Falcon 9 Landing - Claude Opus 5.5 Music Video"   # names the event so space fans find it (the video itself shows no names or logos)
  hook: >-
    December 21, 2015. Cape Canaveral, night. A SpaceX Falcon 9 carried eleven ORBCOMM satellites to orbit, and they
    kept going. Its first stage turned around in the dark, came back, and landed standing up at Landing Zone 1: the
    first orbital-class rocket booster ever to come home. A song for whoever sat in a room and did the math. 🚀
  visuals: >-
    until the Turn the camera only ever looks up: the floodlit rocket on the pad, nine engines lighting, the climb, the
    first stage falling away. On "But this one" the screen goes black, and from "turned around" on it only looks down:
    the booster flipping over the night Earth, grid fins, the long way down to one light on the coast, the entry burn
    (the only orange in the whole video), four legs unfolding, touchdown at Landing Zone 1. Then the desk where somebody
    did the math, and the plan on the whiteboard turning into the two real arcs of light
  question: "Do you remember the first time you saw a Falcon 9 land itself?"
  pause_line: "⏸ Pause on the desk and the whiteboard: the whole landing is in the notes."
  note: >-
    (No logos or names on screen, on purpose. The times on screen follow the December 21, 2015 flight; the desk and the
    whiteboard are imagined.)
