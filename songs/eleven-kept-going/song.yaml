clip_copy:
  "came home":
    yt_title: "The first orbital-class booster that ever came home 🚀"
    hook: "Entry burn. Landing burn. One engine. Four legs. 🚀"
    ig: "Entry burn. Landing burn. One engine. Four legs unfolding into the dark. December 21, 2015: the first orbital-class booster that ever came back and landed 🚀"
  "the turn":
    yt_title: "But this one turned around 🚀"
    hook: "Once it's spent, it's gone. But this one turned around. 🚀"
    ig: "You wanted the sky, you left the ladder behind. Eleven kept going. But this one turned around 🚀"
  "somebody built that":
    yt_title: "Somebody sat in a room and did the math 🚀"
    hook: "Somebody sat in a room and did the math. 🚀"
    ig: "Somebody built that. Somebody sat in a room, looked at the numbers, did the math, and said: it will turn here, burn here, fall this far, light again, and come back. And it came back 🚀 Send this to the engineer in your life."
  "liftoff":
    yt_title: "Eleven small machines, waiting in the dark 🚀"
    hook: "Eleven small machines, waiting in the dark. 🚀"
    ig: "December 21, 2015. Cape Canaveral. Night. Eleven small machines waiting in the dark, built to leave the ground and never come back. Nine engines came alive 🚀"
  "landing zone one":
    yt_title: "No parachute. No ocean. Just concrete. 🚀"
    hook: "No parachute. No ocean. Just concrete. 🚀"
    ig: "It stood there in the smoke. Upright. Landing Zone One: no parachute, no ocean, just concrete under its feet. Like it had somewhere to be tomorrow 🚀"

