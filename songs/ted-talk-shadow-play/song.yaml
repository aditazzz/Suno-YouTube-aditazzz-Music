clip_copy:
  "setup":
    yt_title: "My standup, as a shadow puppet show 🎭"
    hook: "\"He doesn't answer questions. He responds to them.\" 🎭"
    ig: "Curtain up, 9:15 a.m. One question on the agenda: is the file ready? He said, so — stepping back 🎭 Send this to your standup."
  "his shadow":
    yt_title: "His shadow took over the whole standup 🎭"
    hook: "\"Somebody dim the lights, everybody sit down.\" 🎭"
    ig: "Somebody dim the lights. His shadow grows until it covers the whole team, and the story about his father plays in a circle of light 🎭 Tag your Ted. (Kidding. Don't.)"
  "so right journey":
    yt_title: "So. Right? Journey. Unlock. 🎭"
    hook: "\"He starts every sentence with so. He ends every thought with right?\" 🎭"
    ig: "His favorite words fly in on paper birds: so, right?, journey, unlock 🎭 What's your Ted's favorite word?"
  "white flag":
    yt_title: "My calendar waved a white flag 🏳️"
    hook: "\"And I watched my calendar give up.\" 🏳️"
    ig: "And I watched my calendar give up. The pages fly, the hourglass runs out, the calendar waves a white flag 🏳️ Eighteen minutes, no slides, no point."
  "bridge":
    yt_title: "Dana's chair, two years after her hard stop 🕸️"
    hook: "\"Dana has had a hard stop for two years.\" 🕸️"
    ig: "Ted. This is a standup. It is fifteen minutes for eight people. You have used six. Dana's chair has cobwebs now 🕸️"
  "final chorus":
    yt_title: "He took it offline. Into a place none of us can reach 🎭"
    hook: "\"Anyway — happy to take this offline.\" 🎭"
    ig: "There's no Q and A, because there's no A, because there was never a Q. Then he takes it offline, into a place none of us can reach 🎭"

