  hook: >-
    I asked Ted if the file was ready. He said "so — stepping back," stepped back toward the lamp, and his shadow
    grew until it covered the whole room. Our standup, as a shadow puppet play. 🎭
  visuals: >-
    cut-paper puppets behind a lamp-lit paper screen, where the only color on stage is a scrap of red gel: my hair
    clip. Every time Ted steps back toward the lamp, his shadow grows huge and soft over everyone. IT'S A TED TALK
    drops in on strings, his stories open in little irises (his father fishing, his father's father, young Ted in the
    rain with a violin), a cricket keeps time through the pause he thinks is powerful, paper gulls carry his words off,
    and my calendar waves a white flag. At "Ted. This is a standup." I stand up and he shrinks back to size: eight
    people get counted, Dana's empty chair grows cobwebs and a ghost, and the Q in Q&A burns away. In the end he walks
    off down a long road into an iris, and the lamp goes out on the red clip
