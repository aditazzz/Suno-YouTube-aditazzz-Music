clip_copy:
  "setup":
    yt_title: "I asked my coworker one yes/no question 🔭"
    hook: "\"He doesn't answer questions. He responds to them.\" 🔭"
    ig: "9:15 a.m. One question on the agenda: is the file ready? He said, so — stepping back 🔭 Send this to your standup."
  "stepping back":
    yt_title: "He said \"so, stepping back\" so the camera did 🔭"
    hook: "\"I asked him if the file was ready. He said, so — stepping back.\" So the camera did. 🔭"
    ig: "I asked if the file was ready. He said \"so — stepping back.\" So the camera did: out of the room, over the office, over a city where every street is named after something Ted says 🔭"
  "buzzword county":
    yt_title: "A map where every town is named after Ted's buzzwords 🗺️"
    hook: "\"He starts every sentence with so. He ends every thought with right?\" 🗺️"
    ig: "Zoomed out to 50 km: the towns are So, Right?, Synergy and Circle Back, next to Lake Pause and the 15-Minute Loop 🗺️ Tag the coworker who says journey."
  "seen from space":
    yt_title: "My question is still unanswered, even from space 🌍"
    hook: "\"And I watched my calendar give up.\" 🌍"
    ig: "Earth at night, the Moon, the Sun. My question is still pinned in the middle: Is the file ready? Delivered. Not answered 🌍"
  "bridge":
    yt_title: "Back to the standup, from the edge of the solar system 👻"
    hook: "\"It is fifteen minutes for eight people. You have used six.\" 👻"
    ig: "From the edge of the solar system straight back to the room: Ted has used 6 of our 15 minutes, and Dana has become a ghost 👻"
  "final chorus":
    yt_title: "From my standup to the edge of the observable universe 🔭"
    hook: "\"Nobody scheduled it. Nobody can end it.\" 🔭"
    ig: "The Moon, the stars, the Milky Way, the cosmic web, the edge of what anyone can see. Still a Ted talk 🔭"

