clip_copy:
  "setup":
    yt_title: "I turned my standup into charts 📊"
    hook: "\"He doesn't answer questions. He responds to them.\" Fig. 1: How Ted handles a question 📊"
    ig: "Fig. 1: How Ted handles a question. Fig. 2: My will to live, by minute (you'll feel it about four minutes in) 📊 Send this to your standup."
  "first chorus":
    yt_title: "I asked one yes/no question at standup 📊"
    hook: "\"I asked him if the file was ready. He said, so — stepping back.\" 📊"
    ig: "Question 1 of 1: Is the file ready? Yes / No. Answer: a keynote 📊 Topics covered: his father 38%, your question 0%."
  "most-used words":
    yt_title: "Ted's most-used words this morning: so (214) 📊"
    hook: "\"He starts every sentence with so. He ends every thought with right?\" 📊"
    ig: "Ted's most-used words this morning: so (214), right? (61), the file (0) 📊 Buzzword bingo by 9:41 a.m. Tag the coworker who says journey."
  "bridge":
    yt_title: "Dana is a ghost now, Ted 👻"
    hook: "\"It is fifteen minutes for eight people. You have used six.\" 👻"
    ig: "Correction: this is a standup. Fifteen minutes for eight people. Ted has used six. Dana's attendance: 0 since 2024 👻"
  "final chorus":
    yt_title: "There's no Q&A because there was never a Q 📊"
    hook: "\"Nobody scheduled it. Nobody can end it.\" 📊"
    ig: "Meeting length, projected: ∞. There's no Q&A, because there's no A, because there was never a Q 📊 Ted. Location unknown. Last seen taking it offline."

