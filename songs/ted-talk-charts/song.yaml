  hook: >-
    I asked Ted if the file was ready. He said "so — stepping back," somebody dimmed the lights, and our
    fifteen-minute standup became an eighteen-minute keynote with no slides and no point. This time, in charts. 📊
  visuals: >-
    the whole song is one issue of a newspaper called The Daily Standup, with a new chart every few seconds: how Ted
    handles a question (it never reaches ANSWER), my will to live by minute (it falls off a cliff at minute four), the
    topics he covered (your question: 0%), his most-used words (so: 214, the file: 0), buzzword bingo, and a zoom-out on
    the one question nobody answered. When somebody dims the lights the paper sits under a spotlight; at Dana's hard
    stop the office lights snap back on and the paper prints a CORRECTION. In the end Ted's dot unplugs from the team
    network and drifts down into a footnote
