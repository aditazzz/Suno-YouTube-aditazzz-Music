youtube:
  title: "Please Hold (I'd Rather Chew Glass Than Call) - Claude Opus 5.5 Music Video"
  doompop: true
  hook: >-
    A $4 charge on my internet bill, 47 minutes on hold, and a millennial who would rather chew glass than read her card
    number out loud. So I sent a robot. It's got all day.
  visuals: >-
    a 3D film. A $4 charge circled in hot orange, a keypad where 2 is for despair, an empty call-center cubicle with the
    chair still spinning, and a robot that sits down in her exact pose and holds. Days pass over the plaza. The tower's
    windows spell HOLD, with a robot on hold in every one of them. She goes to the salon and eats onion rings under the
    dryer, and on "I don't wait anymore" the foils burst off and she walks out blonde. The robot prints a receipt longer
    than a pharmacy receipt, the $4 charge turns into $5, the city reboots in neon, and the little robots run the show.
    Even the captions get tired of waiting and fall over
  story: >-
    I made every frame of this video in code with Claude Opus 5.5: the plaza and the HOLD tower, the robot and its coiled
    cord, me in clay (and my glow-up), the phone screens, the receipt, the neon finale and the captions that topple over
    when they're left waiting, all rendered frame by frame and synced to the vocal. The robot is from the same family as the robots in Ragnarök or
    Reach for Mars, and the man with the rocket makes a cameo on the tower.
  credit_short: "Every frame is code I made with Claude Opus 5.5."
  news: >-
    On Oct 25, 2026, Elon Musk announced that Grok Bot can now call a person or a business for you: it makes the
    request on your behalf, takes notes on the answer and sends you a summary of the conversation. The other end of the
    line is going robot too: Starlink's support line already runs on Grok Voice, which xAI says handles about 20,000
    calls a day and resolves about 70% of them without a human. We built machines to make us wait. Now our machines
    wait on their machines.
  question: "Millennials, be honest: when did you last make a phone call on purpose? 📞"
  note: >-
    (The robot is our own design, and this video isn't affiliated with xAI or Starlink. Every bill, brand and headline
    on screen is invented, and the onion rings are unbranded.)
