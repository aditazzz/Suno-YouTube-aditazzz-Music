status: produced                     # idea | lyrics | synced | rendered | produced | scheduled | live

aliases:                             # extra ASR spellings for tricky words
  undrop: [drop, dropped, under, ondrop, undo, unbroken, dumb, drawn]
  "3": [three, 3am]

youtube:
  title_hook: "I Dropped Prod at 3 A.M."
  hook: >-
    I ran DROP TABLE on production at 3 a.m. Snowflake didn't lecture me, didn't sulk, didn't bring it up again.
    It just kept the history long enough for me to type one word: UNDROP. ❄️ A love song to the only relationship
    where I'm comfortable paying by consumption.
  visuals: >-
    the production table shatters into ice, Time Travel rewinds it, and the rows rebuild themselves into a snowflake
  question: "What's the worst thing you've ever run in prod?"
  note: >-
    (UNDROP TABLE brings back a dropped table as long as it's still inside its Time Travel retention window:
    1 day by default, up to 90 on Enterprise. Zero-copy clones, auto-suspend and auto-resume are real too.
    This is a fan song, not affiliated with Snowflake.)
  hashtags: [snowflake, dataengineering, aimusic]
  tags: [snowflake undrop, undrop table, snowflake, snowflake data cloud, snowflake time travel, drop table production,
         dropped prod, data engineering, data engineer humor, sql humor, database humor, programmer music, songs about data,
         ai music video, music video made by claude, tech music, developer humor, zero copy clone]
  pinned: >-
    Every frame is code Claude Opus 5.5 wrote: the table really shatters on DROP, Time Travel really rewinds it, and the rows
    rebuild themselves into the snowflake ❄️ The prod_clone_01 getting wrecked while prod stays "not even listening" is my
    favorite detail. What's the worst thing you've ever run in prod? 👇
  extra_chapters:                    # extra chapter marks at the start of a lyric line
    - {line: "Ran DROP TABLE", label: "DROP TABLE production"}
    - {line: "Then I remembered", label: "Then I remembered where I was"}
    - {line: "Check retention", label: "Check retention, babe"}
    - {line: "warehouse isn't", label: "The warehouse goes to sleep"}
    - {line: "sorry, just saw", label: "No \"sorry, just saw this\""}
    - {line: "Time Travel lets", label: "Time Travel"}
  short_hashtags: [snowflake, dataengineering, sqlhumor, programmerhumor, techmusic]
  chapters:                          # section name -> label (unlisted sections are skipped)
    INTRO: "3 a.m. and I was confident"
    PRE: "Patient. Kind."
    CH1: "UNDROP"
    V2: "Zero-copy clones"
    PRE2: "Auto-suspend, auto-resume"
    CH2: "UNDROP (again)"
    BRIDGE: "I've read the docs"
    BUILD: "You remembered what I dropped"
    FINAL: "Final UNDROP"
    OUTRO: "My therapist has questions"

