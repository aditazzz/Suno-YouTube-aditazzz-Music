folder: Snowflake Undrop
model_credit: Claude Opus 5.5        # the model that actually made THIS video
ai_music: true                       # vocals/music AI-generated -> tick YouTube "altered or synthetic content"
stamp_word: UNDROP
cover_time: 85.1                     # vertical cover / first frame of hero clips
thumb_time: 228.0                    # 16:9 hero frame for the thumbnail
