# Clip copy. Clips themselves are auto-planned by `studio.cuts` (or set clips: here to override times).
clip_copy:
  "setup":
    yt_title: "POV: you just ran DROP TABLE on production at 3 a.m. 🫠"
    hook: "Called my mother, drafted my notice, had LinkedIn halfway up. 🫠"
    ig: "POV: it's 3 a.m., you're confident, and you just ran DROP TABLE on production 🫠 Called my mother, drafted my notice, had LinkedIn halfway up."
  "chorus":
    yt_title: "I dropped prod at 3 a.m. and Snowflake took me back ❄️"
    hook: "One word between disaster and updating LinkedIn: UNDROP. ❄️"
    ig: "I ran DROP TABLE on prod at 3 a.m. and @_snowflake_inc took me back ❄️ No ticket, no escalation, no \"per my last email.\" Just one word: UNDROP."
  "bridge":
    yt_title: "I read the Snowflake docs like a love letter 📖❄️"
    hook: "\"Time Travel lets me revisit the past without asking why I'm not over it.\" 📖"
    ig: "I've read the docs. I took notes. I highlighted things. 📖 \"Time Travel lets me revisit the past without asking why I'm not over it.\" For you, @_snowflake_inc, I can live with consumption pricing ❄️"
  "first chorus":
    yt_title: "Snowflake took me back after I dropped prod ❄️"
    hook: "\"Check retention, babe. Put the résumé down. Run one command.\" UNDROP. ❄️"
    ig: "\"Check retention, babe. Put the résumé down. Run one command.\" @_snowflake_inc gave it all back ❄️ Every row, every column, right where I left it."
  "build to final chorus":
    yt_title: "I've never loved a platform for remembering my past ❄️"
    hook: "\"I don't need someone to save me, just a backup I can trust.\" Then the final UNDROP hits. ❄️"
    ig: "I don't need someone to save me, just a backup I can trust ❄️ @_snowflake_inc, this may be the healthiest relationship I've had. My therapist has questions."

