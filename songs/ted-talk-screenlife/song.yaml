  "buzzword bingo":
    yt_title: "Buzzword bingo at standup: BINGO by 9:41 💻"
    hook: "\"He said journey. He said unlock.\" 💻"
    ig: "My standup notes: so (9), right? (6), BINGO at 9:41 💻 What's on your buzzword bingo card?"
  "calendar":
    yt_title: "I watched my calendar give up in real time 📅"
    hook: "\"And I watched my calendar give up.\" 📅"
    ig: "The 15-minute standup block grows over my 1:1 with Dana, then over lunch, until Calendar quits: \"couldn't keep up with today's schedule\" 📅"
  "bridge":
    yt_title: "Dana left the meeting. Two years ago. 👻"
    hook: "\"Dana is a ghost now, Ted.\" 👻"
    ig: "Ted. This is a standup. It is fifteen minutes for eight people. You have used six. Dana left the meeting (hard stop) two years ago 👻"
  "final chorus":
    yt_title: "Only the host can end this meeting 💻"
    hook: "\"Nobody scheduled it. Nobody can end it.\" 💻"
    ig: "End meeting for all? Only the host can end this meeting. Questions: 0. Answers: 0 💻"

youtube:
  title: "TED Talk - Claude Opus 5.5 Music Video"   # shortened on YouTube Oct 21 (was the long per-version title)
  hook: >-
    I asked Ted if the file was ready. He stepped back from his webcam, somebody turned on dark mode, everybody's
    camera went off, and my calendar crashed. Our standup, told entirely on my laptop screen. 💻
  visuals: >-
    the whole song plays out on my laptop screen, like a screenlife film. The standup is a video call and Ted is the
    host. My question sits in the chat while he answers it with a question, and four minutes in the meeting timer says
    it all. At "so — stepping back" he literally steps back from his webcam, somebody dims the lights (dark mode),
    everybody sits down (cameras off), and his virtual background turns into a keynote stage. He shares eighteen
    minutes of blank slides, a photo of his father fishing, a loading circle for circling back and a picture of
    himself at seven in the rain. I keep a tally of every "so" and every "right?", get buzzword bingo, and watch my
    calendar crash. At "Ted. This is a standup." I unmute: eight people, fifteen minutes, Ted has used six, and Dana,
    who left two years ago, is a ghost in her tile now. Nobody can end the meeting, the host has turned off Q&A, and
    when he finally takes it offline, my message to him can't be delivered
  question: "What's the longest 15-minute standup you've ever been in?"
