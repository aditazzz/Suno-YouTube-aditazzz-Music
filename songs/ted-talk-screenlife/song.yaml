    yt_title: "Joining the 9:15 standup with one question 💻"
    hook: "\"He doesn't answer questions. He responds to them.\" 💻"
    ig: "9:14 a.m. Sticky note on my desktop: ask Ted: is the file ready?? (asked 3x). Joining the call now 💻 Send this to your standup."
  "screen share":
    yt_title: "When Ted shares his screen at standup 💻"
    hook: "\"It's a Ted talk. Eighteen minutes, no slides, no point.\" 💻"
