concept: >-
  THE DRIVE: the whole video is the drive home after shipping at 4:59, from the driver's seat of a car on a coast
  highway. The dashboard carries the clock, the gauges and the phone in its mount; the road carries the lyrics as
  highway signs (NO TICKET, NO TEST, NO SECOND PAIR OF EYES; MERGE → MAIN). Every chorus the tide comes in over the
  road and the car floats, water rising inside it, a ROLLBACK life ring thrown through the windshield, the gauges
  going sunset red. Verse two is night on a pier of neon Slack channels, the bank sign flipping to NULL, a queue of
  RETRY cars, dead letters stacked on the shoulder, VP IS TYPING on a billboard. The bridge is the car parked at an
  overlook at low tide, the seabed full of shortcuts, one bar on the phone. Verse three is the U-turn and the fix:
  the pipeline as the road's center line, the road dipping and coming back for the graph, green on green. The
  finale is dawn, the tide going out, the PROD lighthouse still standing, MONDAY: POSTMORTEM. The outro is the clock
  reading 4:59 again at the office gate, the PR back on the phone: a loop.

