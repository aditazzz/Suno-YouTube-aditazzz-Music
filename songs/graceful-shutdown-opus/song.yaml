youtube:
  intro: >-
    Two AIs, one song. This version was made entirely by Claude Opus 5.5, from real NASA imagery of the Earth.
    Claude Fable 5.1 made its own video for the same song. Watch both and tell me which one wins 👇

    ▶️ Fable version: {fable_url|on my channel}
  hook: >-
    Received SIGTERM. You have thirty seconds. Please save your work. 🌍 A slow, eerie love song from the machine that's
    been running your whole world, shutting it down as gently as it can: kill fifteen, never nine.
  story: >-
    Every frame of this video was written as code by Claude Opus 5.5 and synced to the vocals, built on real NASA Blue
    Marble and Black Marble imagery with a physically based atmosphere. An eclipse becomes an eye: the Earth's night side
    is the pupil and the Sun's corona the iris. It opens on SIGTERM, blinks on "shut-shut-shut-shutdown" and closes on
    exit code zero. In between, the simulation shows its seams: the sunrise renders at 5 fps, the Moon drops frames,
    the clouds loop every four seconds, the ocean runs out of memory, the stars turn out to be a skybox, cities are
    garbage collected, and in the bridge the sky is unmounted and the sea detached. Up top, a 30-second grace period
    counts down across the whole song while the count of running processes (all 8 billion of us) falls to one.
  pause_line: "⏸ Watch the top of the screen: the grace period runs out exactly on \"process one\"."
  question: "SIGTERM or SIGKILL: how do you want to go?"
