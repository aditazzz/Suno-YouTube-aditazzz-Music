    A walk across the night desert, inspired by The Alchemist. Every step lights the sand, the trail writes
    itself, and the road turns out to have been there all along. Maktub: it is written, and you still have to walk it.
  credit: >-
    The film is code I made with Claude and Codex: Claude Fable 5.2 built the inner world and my character,
    Claude Opus 5.5 directed, and Codex built the desert.
  credit_short: Every frame is code I made with Claude and Codex.
  question: What wrong turn turned out to be the road for you?
  intro: '🌐 Site: https://aditazzz.github.io/videos/its-written/ | 💻 Code: https://github.com/aditazzz/Suno-YouTube-aditazzz-Music/tree/main/songs/its-written'
  made_with: |-
