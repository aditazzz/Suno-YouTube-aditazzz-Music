    Inner world and my character: Claude Fable 5.2
    Desert, globe and sky: Codex (GPT-6.2), rendered in Blender from Python
    Direction, edit and finishing: Claude Opus 5.5
    Character rig: Rain Rig (c) Blender Foundation | cloud.blender.org, modified
    Milky Way: ESO/S. Brunier (CC BY 4.0)
