  intro: |-   # the Spotify line proves the song's date (released Sept 9, 2026, weeks before the video); she asked for it up top
    I have a blocker. (Take It Offline) · aditazzz
    🎵 The one that started it all: the original song, released on Spotify Sept 9: https://open.spotify.com/track/2E53tiqiVsm5kNq0v78UIl
    Finally got around to making a proper video for it.

    A deadpan song about the daily standup: 9:15, cameras off, and nobody ever has a blocker.
  hook: >-
    9:15, cameras off, fifteen squares and somebody's dog. Yesterday: ticket. Today: ticket. No blockers. Then the new guy
    says "I have a blocker." Out loud. On the call. Fifteen people say the magic words, and we finally went to see where
    "offline" actually goes.
  visuals: >-
    a 3D film. The standup is fifteen floating rooms over the city at 9:15, one clay mannequin per square, cameras off,
    and Somebody's Dog in a headset. TAKE IT OFFLINE is exactly fifteen characters, spaces included, so in the choruses
    every room holds up a letter. The new guy's sixteenth room only gets a question mark. When he says "I have a blocker",
    a giant pink BLOCKER slams onto the roof and every other room goes dark. Five "take it offline"s shove it off the edge,
    and the bridge follows it down into Offline: a shaft through the years, and a field of every blocker ever taken
    offline, all the way down to the dinosaur and the asteroid
  story: >-
    I made every frame of this video in code with Claude Opus 5.5: a 3D city, fifteen floating rooms, the mannequins and
    the lyrics made of green particles, all rendered frame by frame and synced to the vocal. TAKE IT OFFLINE is exactly
    fifteen characters, spaces included, so the fifteen rooms are a letterboard, and the new guy's sixteenth room only gets
    a question mark. When he says it out loud, a giant pink BLOCKER lands on the roof, and it takes five "take it
    offline"s to shove it off the edge. The bridge follows it down into Offline: a shaft through the years and a field of
    every blocker ever taken offline, all the way down to the dinosaur and the asteroid.
  credit_short: "Every frame is code I made with Claude Opus 5.5."
